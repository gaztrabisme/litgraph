[project]
name = "litgraph"
version = "0.1.0"
description = "Gap explorer for the RAG / agent-harness / agent-memory literature"
requires-python = ">=3.12"
dependencies = [
    "defusedxml>=0.7.1",
    "duckdb>=1.0",
    "httpx>=0.27",
    "networkx>=3.3",
    "numpy>=2.5.1",
    "openai>=1.40",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "trafilatura>=1.12",
]

[project.scripts]
litgraph = "litgraph.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/litgraph"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
